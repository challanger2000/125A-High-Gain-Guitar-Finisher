name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin and tests
        run: cmake --build build --config Release --target HighGainGuitarFinisher HighGainGuitarFinisherDSPTests HighGainGuitarFinisherAdaptiveTests HighGainGuitarFinisherAutoLevelTests HighGainGuitarFinisherRoomTests HighGainGuitarFinisherMeasurements HighGainGuitarFinisherLatencyImpulse HighGainGuitarOptimizerBehaviorTests --parallel

      - name: Run DSP and measurement tests
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A-High-Gain-Guitar-Finisher.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "125A-High-Gain-Guitar-Finisher.vst3 bundle not found" }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $plugin.FullName -Destination artifact -Recurse -Force

          if (-not (Test-Path "artifact\125A-High-Gain-Guitar-Finisher.vst3\Contents")) {
            throw "Staged VST3 bundle is incomplete"
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: 125A-High-Gain-Guitar-Finisher-Windows-VST3
          path: artifact
